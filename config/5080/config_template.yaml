promotion_class:
- class_id: A
  code: Discount
  code_jp: 割引
  code_zh: 折扣
  code_zh_tw: 折扣
  description: Discount applied at line item or transaction level
  description_jp: 割引が行われ、商品行項目またはトランザクションレベルで適用されます
  description_zh: 商品行项目或交易总额折扣
  description_zh_tw: 商品行項目或交易總額折扣
- class_id: B
  code: Fixed Quantity/Price
  code_jp: 固定數量/定価
  code_zh: 固定数量/价格
  code_zh_tw: 固定數量/價格
  description: A certain discount or special price associated with a certain set of
    items, when purchased together
  description_jp: 特定アイテムのセットが購入されたときに、特定の割引または特定価格が適用されます
  description_zh: 购买特定组合商品时享受的折扣或特殊价格
  description_zh_tw: 購買特定組合商品時享受的折扣或特殊價格
- class_id: C
  code: Gift with Purchase
  code_jp: 購入贈り
  code_zh: 购买赠礼
  code_zh_tw: 購買贈禮
  description: A gift is provided to the customer when they purchase certain, defined
    item(s)
  description_jp: 顧客が特定アイテムを購入すると、ギフトが提供されます
  description_zh: 顾客购买特定商品时赠送礼品
  description_zh_tw: 顧客購買特定商品時贈送禮品
- class_id: D
  code: Buy X Get Y
  code_jp: 購入X個でY個
  code_zh: 买X送Y
  code_zh_tw: 買X送Y
  description: The purchase of a certain, defined item allows the customer to receive
    a different item at no cost or a discount
  description_jp: 顧客が特定アイテムを購入すると、別のアイテムが無料で提供され、金額が0円か割引が適用されます
  description_zh: 购买特定商品可免费获得其他商品或享受折扣
  description_zh_tw: 購買特定商品可免費獲得其他商品或享受折扣
