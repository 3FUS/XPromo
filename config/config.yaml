promotion_condition:
  - condition_name : "Condition Type"
    value_type: "LIST"
    condition_value: [ "Quantity", "Amount"]
  - condition_name: "Threshold Style"
    value_type: "LIST"
    condition_value:
      Quantity: [">=","Between","Every Quantity"]
      Amount : [ ">="]
  - condition_name: "MinQty"
    value_type: "number"
  - condition_name: "MaxQty"
    value_type: "number"
  - condition_name: "MinItemTotal"
    value_type: "number"

promotion_result:
  - result_name: "Apply Type"
    value_type: "LIST"
    condition_value: [ "Transaction", "Line" ]
  - result_name: "Action Qty"
    value_type: "number"
  - result_name: "Discount Type"
    value_type: "LIST"
    condition_value: [ "PERCENT_OFF", "CURRENCY_OFF" ,"NEW_PRICE"]
  - result_name: "Discount Value"
    value_type: "number"
  - result_name: "Discount Overlap"
    value_type: "CheckBox"

promotion_level:
  - level_code: ""
    level_value: 0
  - level_code: "Level_1"
    level_value: 1
  - level_code: "Level_2"
    level_value: 2
  - level_code: "Level_3"
    level_value: 3
  - level_code: "Level_4"
    level_value: 4


promotion_type:
  - type_code: "Product"
    type_value: "Product"
  - type_code: "Coupon"
    type_value: "Coupon"


promotion_group:
  - group_code: 0
    group_value: "Overlay"
  - group_code: 1
    group_value: "Exclusive"

item_column:
  'item_id': { 'width': 120, 'name': 'Item Id' }
  'item_name': { 'width': 180, 'name': 'Item Name' }
  'item_department': { 'width': 100, 'name': 'Department'}
  'item_price': { 'width': 100, 'name': 'Price' }

location_column:
  'rtl_loc_id': { 'width': 80, 'name': 'Location Id' }
  'store_name': { 'width': 120, 'name': 'Store Name' }
  'city': { 'width': 100, 'name': 'City' }

customer_column:
  'party_id': { 'width': 80, 'name': 'Customer Id' }
  'first_name': { 'width': 120, 'name': 'Customer Name' }
  'cust_phone': { 'width': 120, 'name': 'Phone' }


