name: Build Windows Installer with PyInstaller

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    name: Build EXE and Installer for Windows

    env:
      VERSION: 25.0.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Verify SQL Server ODBC Driver
        run: |
          # 直接验证驱动程序是否存在
          $drivers = powershell -Command "Get-OdbcDriver | Where-Object { `$_.Name -like '*SQL Server*' }"
          if ($drivers.Count -eq 0) {
            echo "Installing SQL Server ODBC Driver..."
            choco install sql-server-odbcdriver -y
            refreshenv
          }

          echo "Available SQL Server ODBC Drivers:"
          powershell -Command "Get-OdbcDriver | Where-Object { `$_.Name -like '*SQL Server*' } | Format-Table Name, Platform"

      - name: Install dependencies
        run: |    
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install NSIS
        run: |
          choco install nsis -y
          refreshenv

      - name: Download NSSM
        run: |
          # 下载 NSSM 到项目目录
          curl -L -o nssm.zip https://nssm.cc/release/nssm-2.24.zip
          Expand-Archive -Path nssm.zip -DestinationPath .
          Copy-Item "nssm-2.24/win64/nssm.exe" -Destination .

      - name: Build EXE with PyInstaller
        run: |
          python -m PyInstaller --onefile --hidden-import=pyodbc --name PromoX main.py

      - name: Prepare config files
        run: |
          # 创建配置文件目录
          mkdir dist\config
          
          # 复制配置文件到安装包目录
          copy config\*.yaml dist\config\
          copy config\*.py dist\config\
          
          # 创建配置文件模板目录（用于安装时选择是否覆盖）
          mkdir dist\config_templates
          copy config\*.yaml dist\config_templates\
          copy config\*.py dist\config_templates\
          
          # 复制 NSSM 到安装包目录
          copy nssm.exe dist\

      - name: Debug information
        run: |    
          echo "Current directory contents:"
          dir
          echo "Dist directory contents:"
          dir "dist"

      - name: Create installer with NSIS
        run: |
          if (!(Test-Path "dist\PromoX.exe")) {
            echo "Error: dist\PromoX.exe not found, cannot create installer"
            exit 1
          }
          
          # 创建安装脚本
          echo '!include "MUI2.nsh"' > installer.nsi
          echo '!include "nsDialogs.nsh"' >> installer.nsi
          echo '!include "LogicLib.nsh"' >> installer.nsi
          echo '' >> installer.nsi
          echo 'Name "PromoX"' >> installer.nsi
          echo 'OutFile "dist\PromoX-Installer.exe"' >> installer.nsi
          echo "InstallDir $PROGRAMFILES\PromoX" >> installer.nsi
          echo 'RequestExecutionLevel admin' >> installer.nsi
          echo '' >> installer.nsi
          
          # 定义变量
          echo 'Var ServiceName' >> installer.nsi
          echo 'Var ServerPort' >> installer.nsi
          echo 'Var ConfigFilePath' >> installer.nsi
          echo 'Var Dialog' >> installer.nsi
          echo 'Var Label1' >> installer.nsi
          echo 'Var Label2' >> installer.nsi
          echo 'Var ServiceNameText' >> installer.nsi
          echo 'Var ServerPortText' >> installer.nsi
          echo '' >> installer.nsi
          
          # 定义安装页面
          echo '!define MUI_ABORTWARNING' >> installer.nsi
          echo '!insertmacro MUI_PAGE_WELCOME' >> installer.nsi
          echo '!insertmacro MUI_PAGE_DIRECTORY' >> installer.nsi
          echo '' >> installer.nsi
          
          # 添加自定义配置页面
          echo 'Page custom ConfigPageShow ConfigPageLeave' >> installer.nsi
          echo '' >> installer.nsi
          
          echo '!insertmacro MUI_PAGE_INSTFILES' >> installer.nsi
          echo '!insertmacro MUI_PAGE_FINISH' >> installer.nsi
          echo '' >> installer.nsi
          
          # 定义卸载页面
          echo '!insertmacro MUI_UNPAGE_CONFIRM' >> installer.nsi
          echo '!insertmacro MUI_UNPAGE_INSTFILES' >> installer.nsi
          echo '' >> installer.nsi
          
          # 语言设置
          echo '!insertmacro MUI_LANGUAGE "English"' >> installer.nsi
          echo '' >> installer.nsi
          
          # 添加版本信息到安装程序属性
          echo '!define VERSION "${{ env.VERSION }}"' >> installer.nsi
          echo 'VIProductVersion "${{ env.VERSION }}.0.0"' >> installer.nsi
          echo 'VIAddVersionKey "ProductName" "PromoX"' >> installer.nsi
          echo 'VIAddVersionKey "FileVersion" "${{ env.VERSION }}"' >> installer.nsi
          echo 'VIAddVersionKey "ProductVersion" "${{ env.VERSION }}"' >> installer.nsi
          echo 'VIAddVersionKey "LegalCopyright" "Copyright (C) 2025"' >> installer.nsi
          echo 'VIAddVersionKey "FileDescription" "PromoX Application"' >> installer.nsi
          echo '' >> installer.nsi
          
          # 初始化函数
          echo 'Function .onInit' >> installer.nsi
          echo '  ; 初始化默认值' >> installer.nsi
          echo '  StrCpy $ServiceName "PromoXService"' >> installer.nsi
          echo '  StrCpy $ServerPort "8000"' >> installer.nsi
          echo 'FunctionEnd' >> installer.nsi
          echo '' >> installer.nsi
          
          # 自定义配置页面函数
          echo 'Function ConfigPageShow' >> installer.nsi
          echo '  !insertmacro MUI_HEADER_TEXT "服务配置" "配置Windows服务名称和端口号"' >> installer.nsi
          echo '' >> installer.nsi
          echo '  ; 创建窗口控件' >> installer.nsi
          echo '  nsDialogs::Create 1018' >> installer.nsi
          echo '  Pop $Dialog' >> installer.nsi
          echo '  ${If} $Dialog == error' >> installer.nsi
          echo '    Abort' >> installer.nsi
          echo '  ${EndIf}' >> installer.nsi
          echo '' >> installer.nsi
          echo '  ${NSD_CreateLabel} 0 0 100% 12u "请配置以下服务参数："' >> installer.nsi
          echo '  Pop $Label1' >> installer.nsi
          echo '' >> installer.nsi
          echo '  ${NSD_CreateLabel} 0 20 100% 12u "Windows服务名称："' >> installer.nsi
          echo '  Pop $Label2' >> installer.nsi
          echo '' >> installer.nsi
          echo '  ${NSD_CreateText} 0 35 100% 12u "$ServiceName"' >> installer.nsi
          echo '  Pop $ServiceNameText' >> installer.nsi
          echo '  ${NSD_SetFocus} $ServiceNameText' >> installer.nsi
          echo '' >> installer.nsi
          echo '  ${NSD_CreateLabel} 0 55 100% 12u "服务端口号："' >> installer.nsi
          echo '  Pop $Label1' >> installer.nsi
          echo '' >> installer.nsi
          echo '  ${NSD_CreateText} 0 70 100% 12u "$ServerPort"' >> installer.nsi
          echo '  Pop $ServerPortText' >> installer.nsi
          echo '' >> installer.nsi
          echo '  nsDialogs::Show' >> installer.nsi
          echo 'FunctionEnd' >> installer.nsi
          echo '' >> installer.nsi
          
          # 配置页面离开函数
          echo 'Function ConfigPageLeave' >> installer.nsi
          echo '  ; 获取用户输入的值' >> installer.nsi
          echo '  ${NSD_GetText} $ServiceNameText $ServiceName' >> installer.nsi
          echo '  ${NSD_GetText} $ServerPortText $ServerPort' >> installer.nsi
          echo '' >> installer.nsi
          echo '  ; 验证端口号是否为数字' >> installer.nsi
          echo '  StrCmp $ServerPort "" +2' >> installer.nsi
          echo '  IntOp $0 $ServerPort + 0' >> installer.nsi
          echo '  IfErrors 0 +3' >> installer.nsi
          echo '    MessageBox MB_ICONEXCLAMATION|MB_OK "请输入有效的端口号！"' >> installer.nsi
          echo '    Abort' >> installer.nsi
          echo 'FunctionEnd' >> installer.nsi
          echo '' >> installer.nsi
          
          # 安装部分
          echo 'Section "PromoX"' >> installer.nsi
          echo '  SectionIn RO' >> installer.nsi
          echo '  SetOutPath $INSTDIR' >> installer.nsi
          echo '  File "dist\PromoX.exe"' >> installer.nsi
          echo '  File "dist\nssm.exe"' >> installer.nsi
          echo '' >> installer.nsi
          echo '  SetOutPath $INSTDIR\config' >> installer.nsi
          echo '  File "dist\config\*.*"' >> installer.nsi
          echo 'SectionEnd' >> installer.nsi
          echo '' >> installer.nsi
          
          # 配置文件部分（可选安装）
          echo 'Section "Config Files (Overwrite)"' >> installer.nsi
          echo '  SetOutPath $INSTDIR\config' >> installer.nsi
          echo '  File "dist\config_templates\*.*"' >> installer.nsi
          echo 'SectionEnd' >> installer.nsi
          echo '' >> installer.nsi
          
          # 创建开始菜单快捷方式
          echo 'Section "Start Menu Shortcuts"' >> installer.nsi
          echo '  CreateDirectory "$SMPROGRAMS\PromoX"' >> installer.nsi
          echo '  CreateShortCut "$SMPROGRAMS\PromoX\PromoX.lnk" "$INSTDIR\PromoX.exe"' >> installer.nsi
          echo '  CreateShortCut "$SMPROGRAMS\PromoX\Uninstall.lnk" "$INSTDIR\uninstall.exe"' >> installer.nsi
          echo 'SectionEnd' >> installer.nsi
          echo '' >> installer.nsi
          
          # Windows 服务安装部分
          echo 'Section "Install as Windows Service"' >> installer.nsi
          echo '  ; 设置配置文件路径' >> installer.nsi
          echo '  StrCpy $ConfigFilePath "$INSTDIR\config\config.yaml"' >> installer.nsi
          echo '' >> installer.nsi
          echo '  ; 更新config.yaml中的SERVER_PORT值' >> installer.nsi
          echo '  DetailPrint "正在更新配置文件中的端口号为: $ServerPort"' >> installer.nsi
          echo '  nsExec::ExecToLog "\"$SYSDIR\WindowsPowerShell\v1.0\powershell.exe\" -Command \"& {(Get-Content ''$ConfigFilePath'') -replace ''SERVER_PORT:.*'', ''SERVER_PORT: $ServerPort'' | Set-Content ''$ConfigFilePath''}\""' >> installer.nsi
          echo '' >> installer.nsi
          echo '  ; 安装Windows服务（使用用户指定的服务名称）' >> installer.nsi
          echo '  DetailPrint "正在安装Windows服务: $ServiceName"' >> installer.nsi
          echo '  ExecWait "$INSTDIR\nssm.exe install $ServiceName \"$INSTDIR\PromoX.exe\""' >> installer.nsi
          echo '  ExecWait "$INSTDIR\nssm.exe start $ServiceName"' >> installer.nsi
          echo 'SectionEnd' >> installer.nsi
          echo '' >> installer.nsi
          
          # 注册表信息
          echo 'Section -Post' >> installer.nsi
          echo '  WriteUninstaller "$INSTDIR\uninstall.exe"' >> installer.nsi
          echo '  WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\PromoX" "DisplayName" "PromoX"' >> installer.nsi
          echo '  WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\PromoX" "UninstallString" "$INSTDIR\uninstall.exe"' >> installer.nsi
          echo '  WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\PromoX" "DisplayIcon" "$INSTDIR\PromoX.exe"' >> installer.nsi
          echo '  WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\PromoX" "Publisher" "PromoX"' >> installer.nsi
          echo '  WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\PromoX" "DisplayVersion" "${{ env.VERSION }}"' >> installer.nsi
          echo 'SectionEnd' >> installer.nsi
          echo '' >> installer.nsi
          
          # 卸载部分
          echo 'Section Uninstall' >> installer.nsi
          echo '  ; 停止并移除用户指定的服务名称' >> installer.nsi
          echo '  ExecWait "$INSTDIR\nssm.exe stop $ServiceName"' >> installer.nsi
          echo '  ExecWait "$INSTDIR\nssm.exe remove $ServiceName confirm"' >> installer.nsi
          echo '  Delete "$INSTDIR\uninstall.exe"' >> installer.nsi
          echo '  Delete "$INSTDIR\PromoX.exe"' >> installer.nsi
          echo '  Delete "$INSTDIR\nssm.exe"' >> installer.nsi
          echo '  Delete "$INSTDIR\config\*.*"' >> installer.nsi
          echo '  RMDir "$INSTDIR\config"' >> installer.nsi
          echo '  RMDir "$INSTDIR"' >> installer.nsi
          echo '' >> installer.nsi
          echo '  Delete "$SMPROGRAMS\PromoX\*.*"' >> installer.nsi
          echo '  RMDir "$SMPROGRAMS\PromoX"' >> installer.nsi
          echo '' >> installer.nsi
          echo '  DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\PromoX"' >> installer.nsi
          echo 'SectionEnd' >> installer.nsi
          
          # 显示当前目录和文件信息用于调试
          echo "Current working directory:"
          pwd
          echo "Full path to PromoX.exe:"
          $exePath = Resolve-Path "dist\PromoX.exe"
          echo $exePath
          
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

      - name: Archive installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromoX-installer-${{ env.VERSION }}
          path: dist/PromoX-Installer.exe
